name: Check

on:
  push:
    branches: ['refactor/mimetype-detector-v3']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Select unpublished reader revisions
        run: |
          composer config repositories.file-reader vcs https://github.com/componenta/file-reader
          composer config repositories.stream-reader vcs https://github.com/componenta/stream-reader
          composer require --no-interaction --no-update 'componenta/file-reader:dev-main#d226a3d3196bca882c0e408f07bf3e916f05434b' 'componenta/stream-reader:dev-main#97779ceb09cc119c047aa7fdf388b8a205c00778'
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - run: composer bench
      - run: composer audit --no-dev
      - name: Verify Config 4 and DI 6 integration
        if: matrix.php == '8.5'
        env:
          COMPOSER_ROOT_VERSION: 2.0.x-dev
        run: |
          composer require --dev --no-interaction --prefer-dist --with-all-dependencies \
            'componenta/di:dev-main#e203077d12048936f078d37d1cf3badd661e1716'
          php tests/integration/config-consumer.php vendor/autoload.php
          php tests/integration/validation-consumer.php vendor/autoload.php
