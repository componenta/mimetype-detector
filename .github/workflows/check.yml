name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - run: composer bench
      - run: composer audit --no-dev
      - name: Verify Config 4 and DI 6 integration
        if: matrix.php == '8.5'
        env:
          COMPOSER_ROOT_VERSION: 2.0.x-dev
        run: |
          composer config repositories.validation-compat vcs https://github.com/componenta/validation.git
          composer require --dev --no-interaction --prefer-dist --with-all-dependencies \
            'componenta/di:dev-main#e203077d12048936f078d37d1cf3badd661e1716' \
            'componenta/validation:dev-compat/mimetype-detector-v2#59abbe8d1388fe9ccc016c12dc12a2de389685f7'
          php tests/integration/config-consumer.php vendor/autoload.php
          php vendor/bin/phpunit --bootstrap vendor/autoload.php vendor/componenta/validation/tests/RegressionTest.php --filter testMimeRule
